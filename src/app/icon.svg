<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="url(#accent)" stroke-width="2.5"/>

  <!-- Classical Palace Pediment (Roof) -->
  <polygon points="12,26 32,12 52,26" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round"/>
  <line x1="10" y1="26" x2="54" y2="26" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Classical Columns (Left & Right) -->
  <rect x="15" y="29" width="5" height="19" rx="1.5" fill="#475569"/>
  <rect x="44" y="29" width="5" height="19" rx="1.5" fill="#475569"/>

  <!-- Palace Base Steps -->
  <rect x="11" y="48" width="42" height="3.5" rx="1.5" fill="#6366f1"/>
  <rect x="8" y="52" width="48" height="3.5" rx="1.5" fill="#22d3ee"/>

  <!-- Neon Cyan/Indigo Memory Pin in Center -->
  <path d="M32 21C26.5 21 22 25.5 22 31C22 38.2 32 47 32 47C32 47 42 38.2 42 31C42 25.5 37.5 21 32 21Z" fill="url(#pinGrad)"/>
  <circle cx="32" cy="31" r="4.5" fill="#020617"/>
  <circle cx="32" cy="31" r="2" fill="#22d3ee"/>
</svg>
